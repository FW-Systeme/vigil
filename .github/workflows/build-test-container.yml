name: Build Test Container

on:
  push:
    branches: [main]
    paths:
      - 'e2e/Dockerfile'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: e2e/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vigil-e2e:latest
