name: CI

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Test
        run: go test -race -count=1 ./...

      - name: Coverage check
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | awk '/^total:/ {
            gsub(/%/,"",$3); if ($3+0 < 85)
              {printf "FAIL: coverage %.1f%% < 85%%\n", $3; exit 1}
              else {printf "PASS: coverage %.1f%%\n", $3}}'

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    env:
      VIGIL_E2E_BIN: ${{ github.workspace }}/vigil
      VIGIL_E2E_FIXTURES: ${{ github.workspace }}/e2e/fixtures
      VIGIL_HOME: /tmp/vigil-e2e-home
      VIGIL_LOGROTATE_DIR: /tmp/vigil-e2e-logrotate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build vigil binary
        run: go build -o vigil ./cmd/vigil/

      - name: Install nginx and nodejs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx nodejs
          sudo systemctl start nginx || true

      - name: Create temp dirs
        run: |
          mkdir -p /tmp/vigil-e2e-home
          mkdir -p /tmp/vigil-e2e-logrotate

      - name: E2E Tests
        run: sudo -E go test -tags=e2e -v -count=1 -timeout 15m ./e2e/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Build binary (amd64)
        run: |
          go build -ldflags="-X main.version=${{ github.ref_name }}" \
            -o vigil-linux-amd64 ./cmd/vigil

      - name: Build binary (arm64)
        run: |
          GOARCH=arm64 go build -ldflags="-X main.version=${{ github.ref_name }}" \
            -o vigil-linux-arm64 ./cmd/vigil

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vigil-linux-amd64
            vigil-linux-arm64
          generate_release_notes: true
